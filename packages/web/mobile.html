<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pan</title>
<link rel="stylesheet" href="/static/css/styles.css?v=14">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<style>
/* ── Mobile‑first overrides ── */

body {
  flex-direction: column;
}

/* Sidebar as slide‑in drawer */
#sidebar {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 260px;
  min-width: 260px;
  z-index: 100;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  box-shadow: none;
}
#sidebar.open {
  transform: translateX(0);
  box-shadow: 2px 0 12px rgba(0,0,0,.5);
}

/* Overlay behind sidebar */
.sidebar-overlay {
  display: none;
}
.sidebar-overlay.show {
  display: block;
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0,0,0,.4);
  z-index: 99;
}

/* Hamburger button (shown on mobile only) */
#menuToggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  padding: 0;
  border: 1px solid #30363d;
  border-radius: 6px;
  background: transparent;
  color: #8b949e;
  cursor: pointer;
  font-size: 1.1rem;
  user-select: none;
  -webkit-user-select: none;
  flex-shrink: 0;
}
#menuToggle:hover {
  border-color: #58a6ff; color: #58a6ff;
}

/* Chat full width */
#chat { height: 100%; }

/* Settings panel */
#settingsPanel.open {
  gap: 8px; padding: 8px 12px;
  overflow-x: auto;
}
#settingsPanel select,
#settingsPanel input {
  font-size: .8rem; padding: 6px 8px;
  max-width: none; min-height: 36px;
}
#settingsPanel select { max-width: 160px; min-width: 0; }
#settingsPanel .btn {
  padding: 6px 12px; font-size: .75rem;
  min-height: 36px; margin: 2px 0;
}
#settingsPanel .sep { height: 28px; }
#settingsPanel .model-custom { max-width: 140px; }

/* Messages */
#messages { padding: 8px 10px; gap: 4px; }
.msg { max-width: 95%; font-size: .9rem; padding: 8px 12px; }

/* Top bar */
#topBar {
  padding: 8px 10px; gap: 6px;
  min-height: 44px; flex-wrap: nowrap;
}
#topBar .chat-name {
  font-size: .9rem; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
  max-width: 120px;
}
#topBar .chat-status { font-size: .65rem; }
#topBar .chat-sessionids { display: none !important; }
#settingsBtn {
  padding: 6px 10px; min-height: 36px;
  min-width: 36px; font-size: .85rem;
}

/* Input row */
#inputRow { padding: 8px 10px; gap: 6px; }
#inputRow input { padding: 10px 12px; font-size: .9rem; }
#inputRow button {
  padding: 10px 16px; min-height: 44px;
  min-width: 60px; font-size: .9rem;
}

/* Toast */
.toast {
  bottom: 80px; right: 10px; left: 10px;
  max-width: none; text-align: center;
}

/* Session items */
.sess-del {
  padding: 4px 8px !important;
  min-height: 32px; min-width: 32px;
  font-size: .9rem !important;
}
.sess-item { padding: 10px 14px; }
.sess-item .sess-name { font-size: .9rem; }

/* Mobile worker indicator */
.mobile-dot-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
</style>
</head>
<body>

<div id="sidebar">
  <h1>Pan</h1>
  <div class="sess-actions">
    <div class="ns-quick-group">
      <button class="ns-quick-btn" onclick="quickNewSession()">+ New</button>
      <button class="ns-gear-btn" onclick="newSession()" title="New with custom settings">&#9881;</button>
    </div>
    <div class="import-menu">
      <button id="importBtn">Import ▼</button>
      <div id="importDropdown" class="import-dropdown">
        <div class="import-option" onclick="openImport('cbc')">Import from cbc</div>
        <div class="import-option" onclick="openImport('kimi')">Import from Kimi</div>
      </div>
    </div>
  </div>
  <div id="sessionList"><div class="sidebar-loading">Loading…</div></div>
  <div id="multiSelectBar" style="display:none;padding:8px 14px;border-top:1px solid #30363d;gap:8px;align-items:center">
    <button class="btn-danger" onclick="batchDeleteSelected()">Delete (<span id="selectedCount">0</span>)</button>
    <button onclick="exitMultiSelect()">Cancel</button>
  </div>
</div>

<div id="chat">
  <div id="topBar">
    <button id="menuToggle" onclick="toggleSidebar()">☰</button>
    <span class="chat-empty" id="emptyHint">Select a session</span>
    <span class="chat-name" id="chatName" style="display:none"></span>
    <span class="chat-model" id="chatModel" style="display:none"></span>
    <span id="chatSessionIds" class="chat-sessionids" style="display:none"></span>
    <span id="chatStatus" class="chat-status"></span>
    <button id="viewToggleBtn" onclick="toggleView()" title="Toggle Bubble/TUI view">💬</button>
    <button id="settingsBtn" onclick="toggleSettings()" style="display:none">⚙</button>
  </div>

  <div id="settingsPanel">
    <label>Model</label>
    <select id="settingModel" onchange="updateSetButtonVisibility()"></select>
    <input id="settingModelCustom" class="model-custom" placeholder="custom">
    <div class="sep"></div>
    <div id="modeGroup">
      <label>Mode</label>
      <select id="settingMode" onchange="updateSetButtonVisibility()"></select>
    </div>
    <div class="sep"></div>
    <div id="thinkingGroup">
      <label for="settingThinking">Think</label>
      <input type="checkbox" id="settingThinking" onchange="onThinkingToggle()">
    </div>
    <span id="effortGroup" style="display:none">
      <label for="settingEffort">Effort</label>
      <select id="settingEffort" onchange="updateSetButtonVisibility()"></select>
    </span>
    <div class="sep"></div>
    <button id="applySettingsBtn" class="btn btn-p" style="display:none" onclick="applySettings()">Apply Settings</button>
    <div class="sep"></div>
    <button class="btn" onclick="restartWorker()">Restart</button>
    <button class="btn" onclick="interruptWorker()">Interrupt</button>
    <button class="btn btn-p" onclick="takeoverMobile()">Takeover</button>
    <button class="btn btn-d" onclick="killWorker()">Kill</button>
  </div>

  <div id="messages"></div>

  <button id="scrollBottomBtn" onclick="scrollToBottom()" style="display:none" title="Scroll to bottom">▼</button>

  <div id="inputRow">
    <input id="chatInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter')send()">
    <span class="mobile-dot-wrap">
      <span id="mobileWorkerDot" class="s-dot offline"></span>
      <button type="button" onclick="send()"><span style="pointer-events:none">Send</span></button>
    </span>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- New Session Modal -->
<div id="newSessionModal">
  <div class="ns-panel">
    <div class="ns-header">
      <span class="ns-heading">New Session</span>
      <button id="closeNewSessionModal" class="ns-close">&times;</button>
    </div>
    <div class="ns-body">
      <label class="ns-label" for="nsNameInput">Session Name</label>
      <input id="nsNameInput" class="ns-input" type="text" placeholder="auto-generate if empty" maxlength="64">
      <label class="ns-label" for="nsWorkdirInput">Working Directory</label>
      <input id="nsWorkdirInput" class="ns-input" type="text" placeholder="D:\project\my-app (leave empty for default)">
      <label class="ns-label" for="nsAdapterSelect">Agent CLI</label>
      <select id="nsAdapterSelect" class="ns-select">
        <option value="cbc">cbc (CodeBuddy)</option>
        <option value="kimi">kimi (Kimi Code)</option>
      </select>
      <button id="nsCreateBtn" class="ns-create">Create</button>
    </div>
  </div>
</div>

<!-- Import Session Modal -->
<div id="importModal">
  <div class="im-panel">
    <div class="im-header">
      <span class="im-heading">Import Session</span>
      <button id="closeImportModal" class="im-close">&times;</button>
    </div>
    <div class="im-select">
      <label class="im-label">Agent CLI</label>
      <select id="importAdapterSelect">
        <option value="cbc">cbc</option>
        <option value="kimi">kimi</option>
      </select>
    </div>
    <div id="cbcImportFilters" class="im-select">
      <label class="im-label">Workdir</label>
      <select id="cbcDriveSelect">
        <option value="">Drive</option>
      </select>
      <select id="cbcProjectSelect">
        <option value="">Project</option>
      </select>
    </div>
    <div id="kimiImportFilters" class="im-select" style="display:none">
      <label class="im-label">Workspace</label>
      <select id="kimiWorkspaceSelect">
        <option value="">Workspace</option>
      </select>
    </div>
    <div id="importSessionList" class="im-body"></div>
    <div id="importSessionCount" class="im-footer"></div>
  </div>
</div>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<script>
function toggleSidebar(){
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
  if (sidebar.classList.contains('open')) {
    renderSessionList(); // Refresh when opening (hidden elements may not repaint on mobile)
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="/static/js/app.js?v=14"></script>
</body>
</html>
