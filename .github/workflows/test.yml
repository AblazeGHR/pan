name: tests

on:
  push:
    branches: [main, test, "feat/**"]
  pull_request:

jobs:
  pytest:
    # Project is Windows-centric (npm .CMD shim resolution, drive-letter paths
    # as test data, process-tree handling); run on Windows for fidelity.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r minimal-requirements.txt
          pip install -r packages/qq/requirements.txt
          pip install pytest-timeout

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ packages/qq -q
