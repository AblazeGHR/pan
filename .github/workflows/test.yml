name: tests

on:
  push:
    branches: [main, test, "feat/**"]
  pull_request:
  # Explicitly authorized manual runs can select integration/feature refs.
  # The workflow must first be registered on the default branch (see CP_X1 report).
  workflow_dispatch:

jobs:
  pytest:
    # Keep both existing Windows full-suite gates alongside the three-OS fast layer.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: "9.7.0"

      - name: Build React for browser regressions
        working-directory: packages/web
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build

      - name: Install terminal emulator dependencies
        run: npm ci --prefix packages/core/terminal/emulator_sidecar

      - name: Install Codex native test dependency
        shell: pwsh
        run: |
          npm install --global --prefix "$env:RUNNER_TEMP/pan-codex" --no-audit --no-fund @openai/codex@0.162.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/pan-codex" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r minimal-requirements.txt
          pip install -r packages/qq/requirements.txt
          pip install pytest-timeout playwright==1.63.0

      - name: Install browser regression dependency
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pan-playwright
        run: python -m playwright install --only-shell chromium

      - name: Run tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pan-playwright
        run: python scripts/run_tests_isolated.py -- python -m pytest tests/ packages/qq -q -ra --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn

  ubuntu-browser:
    name: ubuntu-browser (authenticated production HTTP, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare fresh browser evidence
        # These are generated fixture outputs in this disposable checkout only.
        # Remove checked-in historical evidence before any setup can fail, so
        # always-upload cannot mistake an old browser result for this run.
        run: |
          mkdir -p evidence/cp-x1-ubuntu-browser
          rm -rf -- artifacts/notification-error-exclusions/http artifacts/history-terminal/http

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: "9.7.0"

      - name: Install Python browser test dependencies
        run: >
          python -m pip install -r minimal-requirements.txt
          -r packages/qq/requirements.txt pytest pytest-timeout playwright==1.63.0

      - name: Build production React bundle
        working-directory: packages/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Chromium and Linux system dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pan-playwright
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Run owned authenticated HTTP and production Chromium tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pan-playwright
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          python scripts/run_tests_isolated.py -- python -m pytest tests/test_notification_http.py tests/test_history_terminal_http.py -q -ra --junitxml=evidence/cp-x1-ubuntu-browser/pytest.xml 2>&1 | tee evidence/cp-x1-ubuntu-browser/pytest.log

      - name: Upload fresh Ubuntu browser results and owned cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-browser-py312
          path: |
            evidence/cp-x1-ubuntu-browser/
            artifacts/notification-error-exclusions/http/
            artifacts/history-terminal/http/
          if-no-files-found: warn

  platform-fast:
    name: platform-fast (${{ matrix.os }}, Python 3.12)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fast gate and full-collection dependencies
        # No browser download, Node build or provider CLI needed in this layer.
        run: >
          python -m pip install -r minimal-requirements.txt
          -r packages/qq/requirements.txt pytest pytest-timeout playwright==1.63.0

      - name: Real server import, full collection and core contracts
        run: python scripts/platform_fast_gate.py --output evidence/cp-x1-ci

      - name: Upload fast gate logs, collection errors and platform skips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-fast-${{ matrix.os }}-py312
          path: evidence/cp-x1-ci/
          if-no-files-found: warn
