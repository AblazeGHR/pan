name: tests

on:
  push:
    branches: [main, test, "feat/**"]
  pull_request:

jobs:
  pytest:
    # Project is Windows-centric (npm .CMD shim resolution, drive-letter paths
    # as test data, process-tree handling); run on Windows for fidelity.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install terminal emulator dependencies
        run: npm ci --prefix packages/core/terminal/emulator_sidecar

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r minimal-requirements.txt
          pip install -r packages/qq/requirements.txt
          pip install pytest-timeout

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ packages/qq -q -ra --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn
