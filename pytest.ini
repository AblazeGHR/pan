# Pytest configuration — root-level, applies to `pytest` from repo root.
# testpaths: bare `pytest` collects all suites (tests/, packages/qq and
#            packages/wechat).
# timeout: requires pytest-timeout; if absent pytest only emits a warning,
#          other options remain effective.
[pytest]
testpaths = tests packages/qq packages/wechat
addopts = -q
timeout = 300
filterwarnings =
    ignore::DeprecationWarning:nonebot.*
